name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  workflow_call:

permissions:
  contents: read

jobs:
  generated-fonts-are-current:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify generated fonts and idempotence
        run: |
          for pass in 1 2; do
            python3 fonts/derive.py serif sans cartoon future
            python3 fonts/build.py
            python3 fonts/webfont.py
            git diff --exit-code
          done

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
      - name: Install Linux build dependencies
        timeout-minutes: 8
        run: bash scripts/install-linux-dependencies.sh

      - name: Test
        working-directory: BlinkenBadge/src-tauri
        run: cargo test --locked
      - name: Format handwritten Rust
        working-directory: BlinkenBadge/src-tauri
        run: rustfmt --check --edition 2021 --config skip_children=true build.rs src/*.rs
      - name: Clippy
        working-directory: BlinkenBadge/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json
      - name: Install dependencies
        working-directory: BlinkenBadge
        run: npm ci
      - name: Typecheck
        working-directory: BlinkenBadge
        run: npx tsc --noEmit
      - name: Test
        working-directory: BlinkenBadge
        run: npm test
      - name: Build desktop frontend
        working-directory: BlinkenBadge
        run: npm run build
      - name: Build web frontend
        working-directory: BlinkenBadge
        run: npm run build:web

  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Audit npm lockfile
        working-directory: BlinkenBadge
        run: npm audit --audit-level=low
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
          shared-key: dependency-audit
      - name: Install advisory scanner
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisory exception deadline
        run: python3 scripts/check-advisory-exceptions.py
      - name: Audit Cargo lockfile
        working-directory: BlinkenBadge/src-tauri
        run: cargo deny --locked check advisories

  checks:
    if: always()
    needs: [generated-fonts-are-current, rust, web, dependency-audit]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
