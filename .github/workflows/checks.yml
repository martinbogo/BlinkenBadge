name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  workflow_call:

permissions:
  contents: read

jobs:
  generated-fonts-are-current:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify generated fonts and idempotence
        run: |
          for pass in 1 2; do
            python3 fonts/derive.py serif sans cartoon future comic arcade terminal stencil outline tiny punk script
            python3 fonts/build.py
            python3 fonts/webfont.py
            git diff --exit-code
          done

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
      - name: Install Linux build dependencies
        timeout-minutes: 8
        run: bash scripts/install-linux-dependencies.sh

      - name: Test
        working-directory: BlinkenBadge/src-tauri
        run: cargo test --locked
      - name: Format handwritten Rust
        working-directory: BlinkenBadge/src-tauri
        run: rustfmt --check --edition 2021 --config skip_children=true build.rs src/*.rs
      - name: Clippy
        working-directory: BlinkenBadge/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json
      - name: Install dependencies
        working-directory: BlinkenBadge
        run: npm ci
      - name: Typecheck
        working-directory: BlinkenBadge
        run: npx tsc --noEmit
      - name: Test
        working-directory: BlinkenBadge
        run: npm test
      - name: Build desktop frontend
        working-directory: BlinkenBadge
        run: npm run build
      - name: Build web frontend
        working-directory: BlinkenBadge
        run: npm run build:web

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
          shared-key: android
      - name: Configure Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: BlinkenBadge
        run: npm ci
      - name: Build Android test APK
        working-directory: BlinkenBadge
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
          shared-key: ios
      - name: Install dependencies
        working-directory: BlinkenBadge
        run: npm ci
      - name: Build iOS without signing credentials
        working-directory: BlinkenBadge
        env:
          APPLE_DEVELOPMENT_TEAM: 5QAGYV54MK
        run: npm run tauri -- ios build --debug --target aarch64 --no-sign --archive-only --ci

  dependency-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Audit npm lockfile
        working-directory: BlinkenBadge
        run: npm audit --audit-level=low
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
          shared-key: dependency-audit
      - name: Install advisory scanner
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Check advisory exception deadline
        run: python3 scripts/check-advisory-exceptions.py
      - name: Audit Cargo lockfile
        working-directory: BlinkenBadge/src-tauri
        run: cargo deny --locked check advisories

  checks:
    if: always()
    needs: [generated-fonts-are-current, rust, web, android, ios, dependency-audit]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
