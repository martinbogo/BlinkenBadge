name: Release

# Pushing a version tag builds installers on every platform and publishes them
# as a GitHub release. Running it by hand from the Actions tab builds the same
# things and leaves them as workflow artifacts, so the matrix can be exercised
# without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every runner builds natively, so no --target is passed and the bundle path
  # is the same everywhere.
  BUNDLE: BlinkenBadge/src-tauri/target/release/bundle

jobs:
  # A tag that disagrees with the manifests would produce installers whose
  # filenames contradict the release they are attached to. Fail early instead.
  check-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate versions and release source
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          node scripts/check-version.mjs
          if [ "$IS_TAG" = "true" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi

  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: [check-version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    environment:
      name: ${{ matrix.os == 'macos-latest' && github.repository == 'martinbogo/BlinkenBadge' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || 'build' }}

    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: BlinkenBadge/src-tauri
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # webkit2gtk 4.1 is the Tauri v2 webview. libudev is needed by hidapi's
      # hidraw backend, which is how the badge is reached over USB.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: bash scripts/install-linux-dependencies.sh

      - name: Install dependencies
        working-directory: BlinkenBadge
        run: npm ci

      - name: Compile without signing credentials
        working-directory: BlinkenBadge
        run: npm run tauri -- build --no-bundle -- --locked

      - name: Bundle unsigned installers
        if: runner.os != 'macOS' || github.repository != 'martinbogo/BlinkenBadge' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        working-directory: BlinkenBadge
        run: npm run tauri -- bundle --no-sign

      - name: Sign and notarize macOS installers
        if: runner.os == 'macOS' && github.repository == 'martinbogo/BlinkenBadge' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: BlinkenBadge
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required macOS signing credential: $key"
              exit 1
            fi
          done
          npm run tauri -- bundle

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && github.repository == 'martinbogo/BlinkenBadge' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          APP="$BUNDLE/macos/BlinkenBadge.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vvv "$APP"

      # Tauri has no tarball target, so build one from the bare binary. It has
      # no bundled webview and relies on the system webkit2gtk, which is why
      # the packages above remain the recommended route.
      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./BlinkenBadge/package.json').version")
          STAGE="blinkenbadge-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp BlinkenBadge/src-tauri/target/release/blinkenbadge "$STAGE/"
          cp README.md LICENSE PROTOCOL.md 99-led-badge.rules "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz"

      # Collect the installers into one flat directory. Uploading the bundle
      # paths directly preserves the whole target/release/bundle/... tree inside
      # the artifact, and the release step then globs directories rather than
      # files.
      - name: Stage installers
        shell: bash
        run: |
          mkdir -p staging
          for d in dmg msi nsis deb rpm appimage; do
            [ -d "$BUNDLE/$d" ] || continue
            find "$BUNDLE/$d" -maxdepth 1 -type f \
              \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
                 -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
              -exec cp {} staging/ \;
          done
          for f in *.tar.gz; do [ -f "$f" ] && cp "$f" staging/; done
          ls -lh staging

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: staging/*

  # The Windows installers, signed with Azure Artifact Signing (account lilykvm,
  # profile lilykvm-public, West US). No stored secret: azure/login trades
  # GitHub's OIDC token for one of app lilykvm-ci-signing, which trusts only
  # the release environment (v* tags, main) and may only sign. The IDs are
  # variables of that environment.
  sign-windows:
    name: Sign Windows installers
    needs: build
    if: github.repository == 'martinbogo/BlinkenBadge' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      JSIGN: "7.5"
      JSIGN_SHA256: 602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x86_64
          path: windows
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install jsign
        run: |
          curl -fsSLo jsign.jar "https://github.com/ebourg/jsign/releases/download/$JSIGN/jsign-$JSIGN.jar"
          echo "$JSIGN_SHA256  jsign.jar" | sha256sum -c
      - name: Sign
        run: |
          token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$token"
          for f in windows/*.exe windows/*.msi; do
            [ -f "$f" ] || continue
            echo "Signing $f"
            java -jar jsign.jar --storetype TRUSTEDSIGNING \
              --keystore wus.codesigning.azure.net \
              --storepass "$token" \
              --alias lilykvm/lilykvm-public \
              --tsaurl http://timestamp.acs.microsoft.com \
              --tsmode RFC3161 \
              "$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: windows/*
          overwrite: true
          if-no-files-found: error

  verify-windows:
    name: Verify Windows signatures
    needs: [build, sign-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || (github.repository == 'martinbogo/BlinkenBadge' && github.event_name == 'workflow_dispatch')) }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign-windows.result == 'success'
        with:
          name: windows-x86_64
          path: windows
      - name: Download published installers for unsigned smoke runs
        if: needs.sign-windows.result == 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.msi' --dir windows
      - name: Verify Authenticode trust, publisher, and timestamp
        run: ./scripts/verify-windows-signatures.ps1 -Path windows
      - name: Verify tampering is rejected
        run: |
          $original = Get-ChildItem windows/*.exe | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($original.FullName)
          $bytes[4096] = $bytes[4096] -bxor 1
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-installer.exe'
          [System.IO.File]::WriteAllBytes($tampered, $bytes)
          if ((Get-AuthenticodeSignature -LiteralPath $tampered).Status -eq 'Valid') {
            throw 'Tampered installer was accepted.'
          }

  release:
    needs: [build, sign-windows, verify-windows]
    if: github.repository == 'martinbogo/BlinkenBadge' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BlinkenBadge ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft \
            dist/*
          echo "Draft release created. Review it, then publish from the Releases page."
