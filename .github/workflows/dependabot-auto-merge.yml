name: Dependabot auto-merge

# Dependabot's pull requests merge themselves once the required checks pass,
# so security fixes and routine updates do not wait for a person. Major
# version updates are left for review: they are the ones that change APIs.
#
# Dependabot writes each update's kind into its commit message
# ("update-type: version-update:semver-minor"), which is all that
# dependabot/fetch-metadata would read. Reading it directly keeps that action
# off this repository's list of allowed actions.

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'martinbogo/BlinkenBadge'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          messages=$(gh pr view "$PR_URL" --json commits --jq '.commits[].messageBody')
          if ! grep -q 'update-type: version-update:' <<< "$messages"; then
            echo "No update metadata in the commit message. Left for review."
          elif grep -q 'update-type: version-update:semver-major' <<< "$messages"; then
            echo "Includes a major version update. Left for review."
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
