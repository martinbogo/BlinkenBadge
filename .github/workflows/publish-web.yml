name: Publish web app

# Builds the web version of BlinkenBadge and copies the built files into the
# martinbogo.github.io repository, where they are served at
# https://martinbogo.github.io/blinkenbadge/ (lowercase; /BlinkenBadge/ is
# this repository's own Pages site, which holds the privacy policy).
#
# Publish by pushing a tag that starts with web-v; the commit it points to is
# what goes live, and it has to be on main:
#
#   git tag web-v1 origin/main && git push origin web-v1
#
# PAGES_DEPLOY_KEY is the private half of a deploy key with write access to
# martinbogo.github.io and nothing else.

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-web
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Publish only what is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; not publishing."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlinkenBadge/package-lock.json

      - name: Install
        working-directory: BlinkenBadge
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test
        working-directory: BlinkenBadge
        run: |
          npx tsc --noEmit
          npm test

      - name: Build
        working-directory: BlinkenBadge
        run: npm run build:web

      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: martinbogo/martinbogo.github.io
          ref: master
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: site

      - name: Replace blinkenbadge/ with the build
        run: |
          rm -rf site/blinkenbadge
          mkdir -p site/blinkenbadge
          cp -R BlinkenBadge/dist-web/. site/blinkenbadge/

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blinkenbadge
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Publish BlinkenBadge web, ${GITHUB_REF_NAME}, $(date -u +%Y-%m-%d)"
          git push origin master
