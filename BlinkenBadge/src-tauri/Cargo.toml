[package]
name = "blinkenbadge"
version = "1.0.50"
description = "Animation editor for 44x11 monochrome LED name badges (WCH CH582)"
authors = ["Martin Bogomolni"]
license = "Apache-2.0"
repository = "https://github.com/martinbogo/blinkenbadge"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "blinkenbadge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros", "sync"] }
futures = "0.3"
uuid = "1"
chrono = "0.4"
base64 = "0.22"
tempfile = "3"

[target.'cfg(not(target_os = "android"))'.dependencies]
btleplug = "0.11"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
hidapi = "2"
nusb = "0.2.6"
